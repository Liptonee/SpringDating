server.port=8080
spring.application.name=dating-backend
#http://localhost:8080/swagger-ui.html
#spring.profiles.active=dev

# Multipart file
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
#15 мин в миллисекундах
jwt.expiration.access=900000
#7 дней в секундах
jwt.expiration.refresh=604800
jwt.refresh.cookie.secured=false

# CORS
cors.allowed-origins=http://localhost:3000

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=root

# MiniO
minio.endpoint=http://localhost:9000
minio.access-key=admin
minio.secret-key=adminadmin
minio.bucket-name=photos

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP
spring.datasource.hikari.maximum-pool-size=10

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

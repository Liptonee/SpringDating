global:
  scrape_interval: 15s # Как часто опрашивать приложение (по умолчанию 1m)
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'dating-backend'
    metrics_path: '/actuator/prometheus' # Важно: не /metrics по умолчанию, а кастомный путь Actuator[reference:6]
    static_configs:
      - targets: ['host.docker.internal:8080'] # Если Prometheus в Docker, а приложение на хосте
        # 'dating-backend:8080', если оба в одной Docker-сети